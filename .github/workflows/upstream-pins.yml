# SPDX-License-Identifier: MPL-2.0
name: Upstream pins

# Monthly report for pins Dependabot cannot read: native sources, the OpenWrt
# toolchain, the LVGL submodule, Hugo, Gitleaks, and reuse. When a pin needs
# review, one open issue titled "Upstream pin review" is created or updated.
# A later clean run rewrites that issue to say nothing needs review; it is
# never closed automatically. The report never edits pins; review each bump
# against SECURITY.md.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/check-upstream-pins.sh
      - .github/workflows/upstream-pins.yml

permissions:
  contents: read

concurrency:
  # Scheduled and dispatched reports write one repository-wide issue, so they
  # share a group and queue instead of cancelling each other. Pull requests
  # only run the offline self-test and may cancel superseded runs.
  group: ${{ github.event_name == 'pull_request' && format('upstream-pins-pr-{0}', github.event.pull_request.number) || 'upstream-pins-report' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Test upstream pin parsers offline
        run: |
          bash -n tools/check-upstream-pins.sh
          bash tools/check-upstream-pins.sh --selftest

  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The issue describes the repository, so a dispatch from another
          # branch still reports the default branch's pins.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Compare pins with upstream releases
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/check-upstream-pins.sh --selftest
          status=0
          bash tools/check-upstream-pins.sh > "$RUNNER_TEMP/upstream-pins.md" || status=$?
          cat "$RUNNER_TEMP/upstream-pins.md" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "state=clean" >> "$GITHUB_OUTPUT" ;;
            3) echo "state=review" >> "$GITHUB_OUTPUT" ;;
            *)
              # A failed lookup must not read as "all current".
              echo "::error::Upstream pin lookup failed (exit $status)"
              exit "$status"
              ;;
          esac

      - name: Create or update the pin review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ steps.pins.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          table="$RUNNER_TEMP/upstream-pins.md"
          body="$RUNNER_TEMP/upstream-pins-issue.md"
          # A failed lookup stops this step instead of creating a duplicate.
          number=$(gh issue list --state open --search '"Upstream pin review" in:title' \
            --json number,title --jq '[.[] | select(.title == "Upstream pin review")][0].number // empty')
          if [ "$STATE" = clean ] && [ -z "$number" ]; then
            echo "Every pin is current and no review issue is open"
            exit 0
          fi
          {
            if [ "$STATE" = clean ]; then
              echo "No pin needs review as of this run. Close this issue once any open follow-up is done."
            else
              grep -q '| behind |$' "$table" &&
                echo "- At least one pin that Dependabot cannot update is behind upstream."
              grep -q '| disagree |$' "$table" &&
                echo "- Two copies of a pin disagree."
              grep -qE '\| (invalid|missing) \|$' "$table" &&
                echo "- A pin is missing or is not a plain version number."
              echo
              echo "Review each bump against \`SECURITY.md\` and \`docs/SOURCE_PROVENANCE.md\`,"
              echo "and update notices, hashes, and lockfiles in the same PR."
            fi
            echo
            cat "$table"
            echo
            echo "Generated by [this run]($RUN_URL) on the default branch."
          } > "$body"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
            echo "Updated issue #$number"
          else
            gh issue create --title "Upstream pin review" --body-file "$body"
          fi
