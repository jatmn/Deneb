# SPDX-License-Identifier: MPL-2.0
name: Upstream pins

# Monthly report for pins Dependabot cannot read: native sources, the OpenWrt
# toolchain, the LVGL submodule, Hugo, Gitleaks, and reuse. When a pin is
# behind, one open issue titled "Upstream pin review" is created or updated.
# The report never edits pins; review each bump against SECURITY.md.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/check-upstream-pins.sh
      - .github/workflows/upstream-pins.yml

permissions:
  contents: read

concurrency:
  group: upstream-pins-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          submodules: false

      - name: Test upstream pin parsers offline
        run: |
          bash -n tools/check-upstream-pins.sh
          bash tools/check-upstream-pins.sh --selftest

  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          submodules: false

      - name: Compare pins with upstream releases
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/check-upstream-pins.sh --selftest
          status=0
          bash tools/check-upstream-pins.sh > "$RUNNER_TEMP/upstream-pins.md" || status=$?
          cat "$RUNNER_TEMP/upstream-pins.md" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "behind=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "behind=true" >> "$GITHUB_OUTPUT" ;;
            *)
              # A failed lookup must not read as "all current".
              echo "::error::Upstream pin lookup failed (exit $status)"
              exit "$status"
              ;;
          esac

      - name: Create or update the pin review issue
        if: steps.pins.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream pin review"
          body="$RUNNER_TEMP/upstream-pins-issue.md"
          {
            echo "At least one pin that Dependabot cannot update is behind upstream."
            echo "Review each bump against \`SECURITY.md\` and \`docs/SOURCE_PROVENANCE.md\`,"
            echo "and update notices, hashes, and lockfiles in the same PR."
            echo
            cat "$RUNNER_TEMP/upstream-pins.md"
            echo
            echo "Generated by [this run]($RUN_URL)."
          } > "$body"
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
            echo "Updated issue #$number"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
