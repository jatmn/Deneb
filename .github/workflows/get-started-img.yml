# SPDX-License-Identifier: MPL-2.0
name: Get-started image

# Publishes Deneb_get_started.img only. Skip when bootstrap sources did not
# change. The image version token is a stock-updater number, not a Deneb
# semver. Do not attach .deneb packages here.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if get-started sources did not change
        required: false
        type: boolean
        default: false
      nightly:
        description: Update the nightly-get-started pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: get-started-img-${{ github.event_name }}-${{ github.event.inputs.nightly || 'false' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: false

      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          NIGHTLY: ${{ github.event.inputs.nightly }}
        run: |
          set -euo pipefail
          version=$(bash tools/get-started-source-changed.sh --version)
          if [ "$EVENT_NAME" = schedule ] || [ "$NIGHTLY" = true ]; then
            tag=nightly-get-started
            prerelease=true
            latest=false
            title='get-started nightly'
          else
            tag=get-started
            prerelease=false
            latest=true
            title=get-started
          fi
          prev=
          if notes=$(gh release view "$tag" --json body --jq .body 2>/dev/null); then
            prev=$(printf '%s\n' "$notes" | awk '/^source_sha:/{print $2; exit}')
          fi
          build=true
          if [ "$FORCE" != true ] && [ -n "$prev" ] && git cat-file -e "${prev}^{commit}" 2>/dev/null; then
            changed=$(bash tools/get-started-source-changed.sh --since "$prev" | awk -F= '$1=="changed"{print $2; exit}')
            if [ "$changed" = false ]; then
              build=false
            fi
          fi
          {
            echo "BUILD=$build"
            echo "VERSION=$version"
            echo "TAG=$tag"
            echo "PRERELEASE=$prerelease"
            echo "LATEST=$latest"
            echo "TITLE=$title"
          } >> "$GITHUB_ENV"
          echo "Get-started $tag build=$build version=$version previous_source_sha=${prev:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install bootstrap image dependency
        if: env.BUILD == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends python3 python3-venv
          python3 -m venv build/bootstrap-python
          build/bootstrap-python/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tools/bootstrap-requirements.txt
          echo "DENEB_BOOTSTRAP_PYTHON=$PWD/build/bootstrap-python/bin/python" >> "$GITHUB_ENV"

      - name: Build get-started image
        if: env.BUILD == 'true'
        run: |
          set -euo pipefail
          output=build/published-get-started
          bash tools/build-get-started.sh --version "$VERSION" --output-directory "$output"
          artifact=$output/Deneb_get_started.img
          checksum=$artifact.sha256
          expected_members='update.sh
          README.md
          manifest.txt
          deneb-boot-320x240.png
          deneb-splash-128x102.jpg
          deneb-splash.rgb565'
          actual_members=$(tar -tf "$artifact")
          [ "$actual_members" = "$expected_members" ]
          manifest_version=$(tar -xOf "$artifact" manifest.txt | awk -F= '$1 == "version" { print; exit }')
          [ "$manifest_version" = "version=$VERSION" ]
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "CHECKSUM=$checksum" >> "$GITHUB_ENV"

      - name: Publish image to GitHub Release
        if: env.BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=$RUNNER_TEMP/get-started-release-notes.md
          {
            echo 'Deneb_get_started.img (Deneb overlay only; no UltiMaker firmware or rootfs).'
            echo
            echo "source_sha: $GITHUB_SHA"
            echo "version: $VERSION"
          } > "$notes_file"
          extra=(--notes-file "$notes_file" --target "$GITHUB_SHA" --title "$TITLE")
          if [ "$PRERELEASE" = true ]; then
            extra+=(--prerelease)
          fi
          if [ "$LATEST" = true ]; then
            extra+=(--latest=true)
          else
            extra+=(--latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${extra[@]}"
          else
            gh release create "$TAG" "${extra[@]}"
          fi
          gh release upload "$TAG" "$ARTIFACT" "$CHECKSUM" --clobber
