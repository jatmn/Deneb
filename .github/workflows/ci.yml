name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Do not listen for `edited`. GitHub does not evaluate job `name:`
    # expressions on skipped jobs, so a title/body edit published four
    # skipped checks named the raw expression. Sourcery body rewrites
    # kept starting those runs. Title/body edits must not start CI at
    # all, so they cannot replace a required result on the same SHA.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # A delayed main push must not cancel validation for a different commit.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Conditional producers feed stable required contexts. select-validation
  # stays required so a selector failure cannot skip work and still look green.
  select-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.changes.outputs.native }}
      shell: ${{ steps.changes.outputs.shell }}
      bootstrap: ${{ steps.changes.outputs.bootstrap }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Select validation lanes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash tools/select-ci-validation.sh

  policy-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Gitleaks and the publication-boundary audit both inspect Git history.
          fetch-depth: 0
          submodules: false

      - name: Confirm policy tools
        run: |
          if ! command -v pipx >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends pipx
          fi
          command -v pwsh
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends unzip
          fi

      - name: Build and inspect Cura plugin package
        run: |
          set -euo pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build-cura-plugin.ps1
          bash tools/inspect-cura-plugin-package.sh dist/DenebUM2CNetworkPrinting.curapackage
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/inspect-cura-plugin-package-selftest.ps1

      - name: Check documentation and publication boundary
        shell: pwsh
        run: tools/check-publication-boundary.ps1

      - name: Detect public site changes
        id: site
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          needs=false
          public_site_path() {
            case "$1" in
              website/*|assets/branding/*|docs/touchscreen-screens/*) return 0 ;;
              docs/GETTING_STARTED.md|.github/workflows/website.yml) return 0 ;;
              tools/check-publication-boundary.ps1|tools/check-markdown-links.ps1) return 0 ;;
              website/scripts/check-site-links.sh|website/scripts/check-site-links-selftest.sh) return 0 ;;
            esac
            return 1
          }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(mktemp)
            trap 'rm -f "$changed_files"' EXIT
            git diff --no-renames --name-only -z "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_files"
            while IFS= read -r -d '' path; do
              [[ -n "$path" ]] || continue
              if public_site_path "$path"; then needs=true; break; fi
            done < "$changed_files"
          else
            needs=true
          fi
          printf 'needs_site_build=%s\n' "$needs" >> "$GITHUB_OUTPUT"
          if [[ "$needs" == true ]]; then
            printf '%s\n' 'Public site: full Hugo build selected for this revision range.'
          else
            printf '%s\n' 'Public site: skipping Hugo build (no website-impacting paths in range).'
          fi

      - name: Set up Go
        if: steps.site.outputs.needs_site_build == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.25.x"
          cache-dependency-path: website/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build public site (Hugo + post-build link check)
        if: steps.site.outputs.needs_site_build == 'true'
        run: |
          HUGO_VERSION="$(tr -d '[:space:]' < website/vendor-pins/hugo.version)"
          expected="$(awk '{print $1}' website/vendor-pins/hugo_linux-amd64.tar.gz.sha256)"
          curl -fsSL -o /tmp/hugo.tgz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          actual="$(sha256sum /tmp/hugo.tgz | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Hugo tarball checksum mismatch: got ${actual}, expected ${expected}" >&2
            exit 1
          fi
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          export HUGO_BIN=/tmp/hugo
          bash website/scripts/build.sh

      - name: Check license declarations
        run: pipx run --spec reuse==6.2.0 reuse lint

      - name: Lint browser JavaScript
        run: |
          npm ci --ignore-scripts --prefix tools/eslint
          bash tools/eslint-web-selftest.sh

      - name: Test Pullfrog command authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare the checked-out PR merge commit to its base parent.
            changes=$(git diff --no-renames --name-only HEAD^1 HEAD -- \
              .github/workflows/ci.yml .github/workflows/pullfrog.yml \
              scripts/pullfrog-command-check.mjs scripts/pullfrog-command-check.test.mjs)
            if [ -z "$changes" ]; then
              echo "No Pullfrog authorization inputs changed"
              exit 0
            fi
          fi
          node --test scripts/pullfrog-command-check.test.mjs

      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            diff_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            diff_range="${MERGE_BASE_SHA:?missing merge group base}..HEAD"
          elif [ "$EVENT_NAME" = "push" ] &&
               [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            diff_range="${BEFORE_SHA}..HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_range="HEAD^..HEAD"
          else
            diff_range="$(git hash-object -t tree /dev/null)..HEAD"
          fi
          git diff --check "$diff_range"

      - name: Scan changed Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar xzf "$archive" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            log_opts="--diff-merges=first-parent ${MERGE_BASE_SHA:?missing merge group base}..HEAD"
          elif [ "$EVENT_NAME" = "push" ] &&
               [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            log_opts="${BEFORE_SHA}..HEAD"
          else
            log_opts="--all"
          fi
          ./gitleaks git --redact --no-banner --verbose --log-opts="$log_opts" .

  shell-static-validation:
    needs: select-validation
    if: needs.select-validation.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          submodules: false

      - name: Confirm shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends shellcheck
          fi

      - name: Check shell syntax and style
        shell: bash
        run: |
          bash_shebang='^#![[:blank:]]*(/([^[:blank:]]*/)?bash|/([^[:blank:]]*/)?env[[:blank:]]+(-S[[:blank:]]+)?bash)([[:blank:]]|$)'
          git ls-files -z -- '*.sh' |
            while IFS= read -r -d '' script; do
              shebang=$(head -n 1 -- "$script")
              if [[ $shebang =~ $bash_shebang ]]; then
                bash -n -- "$script"
              else
                sh -n -- "$script"
              fi
            done
          shellcheck tools/setup-linux-build.sh tools/setup-wsl-build.sh tools/setup-mbedtls.sh tools/setup-lvgl.sh tools/setup-lvgl-selftest.sh tools/build-get-started.sh tools/build-update-release.sh tools/write-package-checksum.sh tools/write-package-checksum-selftest.sh tools/ssh-bootstrap-patch-selftest.sh tools/select-ci-validation.sh tools/select-ci-validation-selftest.sh tools/get-started-source-changed.sh tools/inspect-cura-plugin-package.sh tools/eslint-web-selftest.sh
          sh tools/write-package-checksum-selftest.sh
          sh tools/ssh-bootstrap-patch-selftest.sh
          bash tools/select-ci-validation-selftest.sh
          bash tools/get-started-source-changed.sh --selftest

  linux-bootstrap-validation:
    needs: select-validation
    if: needs.select-validation.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          submodules: false

      - name: Install bootstrap image dependency
        run: |
          if python3 -m venv build/bootstrap-python; then
            echo "Using the runner's Python virtual environment support"
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends python3 python3-venv
            /usr/bin/python3 -m venv --clear build/bootstrap-python
          fi
          build/bootstrap-python/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tools/bootstrap-requirements.txt
          echo "DENEB_BOOTSTRAP_PYTHON=$PWD/build/bootstrap-python/bin/python" >> "$GITHUB_ENV"

      - name: Build and inspect Linux bootstrap image
        run: |
          output="build/ci-bootstrap-linux"
          bash tools/build-get-started.sh --version "0.2.8-ci" --output-directory "$output"
          artifact="$output/Deneb_get_started.img"
          checksum="$artifact.sha256"

          expected_members='update.sh
          README.md
          manifest.txt
          deneb-boot-320x240.png
          deneb-splash-128x102.jpg
          deneb-splash.rgb565'
          actual_members=$(tar -tf "$artifact")
          [ "$actual_members" = "$expected_members" ]

          mode=$(tar -tvf "$artifact" | awk '$NF == "update.sh" { print $1; exit }')
          [ "$mode" = '-rwxr-xr-x' ]

          manifest_version=$(tar -xOf "$artifact" manifest.txt | awk -F= '$1 == "version" { print; exit }')
          [ "$manifest_version" = 'version=0.2.8-ci' ]

          rgb565_size=$(tar -xOf "$artifact" deneb-splash.rgb565 | wc -c)
          [ "$rgb565_size" -eq 153600 ]

          (cd "$output" && sha256sum --check "$(basename "$checksum")")

  windows-bootstrap-validation:
    needs: select-validation
    if: needs.select-validation.outputs.bootstrap == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          submodules: false

      - name: Install bootstrap image dependency
        shell: pwsh
        run: |
          py -3 -m venv build/bootstrap-python
          build/bootstrap-python/Scripts/python.exe -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tools/bootstrap-requirements.txt
          "DENEB_BOOTSTRAP_PYTHON=$((Resolve-Path build/bootstrap-python/Scripts/python.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and inspect Windows bootstrap image
        shell: pwsh
        run: |
          $output = "build/ci-bootstrap"
          tools/build-get-started.ps1 -Version "0.2.8-ci" -OutputDirectory $output
          $artifact = Join-Path $output "Deneb_get_started.img"
          $checksum = "$artifact.sha256"

          $expectedMembers = @(
              "update.sh",
              "README.md",
              "manifest.txt",
              "deneb-boot-320x240.png",
              "deneb-splash-128x102.jpg",
              "deneb-splash.rgb565"
          )
          $actualMembers = @(& tar -tf $artifact)
          if ($LASTEXITCODE -ne 0) {
              throw "Windows-built bootstrap archive is unreadable"
          }
          if (Compare-Object -ReferenceObject $expectedMembers -DifferenceObject $actualMembers -SyncWindow 0) {
              throw "Windows-built bootstrap archive has unexpected members"
          }

          $mode = (& tar -tvf $artifact | Where-Object { $_ -match ' update[.]sh$' } | Select-Object -First 1).Split()[0]
          if ($mode -ne '-rwxr-xr-x') {
              throw "Expected update.sh mode 0755, got '$mode'"
          }

          $manifestVersion = & tar -xOf $artifact manifest.txt |
              Where-Object { $_ -like 'version=*' } |
              Select-Object -First 1
          if ($manifestVersion -ne 'version=0.2.8-ci') {
              throw "Unexpected manifest version '$manifestVersion'"
          }

          $inspection = Join-Path $output "inspection"
          New-Item -ItemType Directory -Path $inspection -Force | Out-Null
          & tar -xf $artifact -C $inspection deneb-splash.rgb565
          if ($LASTEXITCODE -ne 0) {
              throw "Could not extract RGB565 splash for inspection"
          }
          $rgb565Size = (Get-Item -LiteralPath (Join-Path $inspection "deneb-splash.rgb565")).Length
          if ($rgb565Size -ne 153600) {
              throw "Expected RGB565 splash size 153600, got '$rgb565Size'"
          }

          $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "Bootstrap checksum mismatch"
          }

  shell-validation:
    needs:
      - select-validation
      - shell-static-validation
      - linux-bootstrap-validation
      - windows-bootstrap-validation
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce selected shell and bootstrap results
        env:
          SELECT_RESULT: ${{ needs.select-validation.result }}
          SHELL_SELECTED: ${{ needs.select-validation.outputs.shell }}
          SHELL_RESULT: ${{ needs.shell-static-validation.result }}
          BOOTSTRAP_SELECTED: ${{ needs.select-validation.outputs.bootstrap }}
          LINUX_BOOTSTRAP_RESULT: ${{ needs.linux-bootstrap-validation.result }}
          WINDOWS_BOOTSTRAP_RESULT: ${{ needs.windows-bootstrap-validation.result }}
        run: |
          require_result() {
            label=$1
            actual=$2
            expected=$3
            if [ "$actual" != "$expected" ]; then
              printf '%s result was %s; expected %s\n' "$label" "$actual" "$expected" >&2
              exit 1
            fi
          }

          require_result selector "$SELECT_RESULT" success
          if [ "$SHELL_SELECTED" = true ]; then
            require_result shell-static "$SHELL_RESULT" success
          else
            require_result shell-static "$SHELL_RESULT" skipped
          fi
          if [ "$BOOTSTRAP_SELECTED" = true ]; then
            require_result linux-bootstrap "$LINUX_BOOTSTRAP_RESULT" success
            require_result windows-bootstrap "$WINDOWS_BOOTSTRAP_RESULT" success
          else
            require_result linux-bootstrap "$LINUX_BOOTSTRAP_RESULT" skipped
            require_result windows-bootstrap "$WINDOWS_BOOTSTRAP_RESULT" skipped
          fi

  native-validation:
    needs: select-validation
    if: needs.select-validation.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          filter: blob:none
          submodules: false

      - name: Check out pinned LVGL build inputs
        run: sh tools/setup-lvgl.sh

      - name: Install native host libraries
        run: |
          packages=(bzip2 libzmq3-dev lighttpd openssl unzip)
          if ! command -v cmake >/dev/null; then
            packages+=(cmake)
          fi
          if ! command -v g++ >/dev/null; then
            packages+=(build-essential)
          fi
          if ! command -v file >/dev/null; then
            packages+=(file)
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends "${packages[@]}"
          sh tools/setup-mbedtls.sh "$PWD/build/ci-mbedtls"

      - name: Run repository fixture and audit self-tests
        timeout-minutes: 10
        run: |
          sh tools/setup-lvgl-selftest.sh
          bash tools/build-update-release-selftest.sh
          sh tools/deneb-package-reproducibility-selftest.sh
          bash tools/deneb-compile-all-selftest.sh
          bash tools/deneb-stock-menu-prune-selftest.sh
          bash tools/deneb-stock-menu-import-check-selftest.sh
          bash tools/deneb-printsvc-smoke-selftest.sh
          bash tools/deneb-printsvc-stability.sh --selftest
          bash tools/deneb-printsvc-init-selftest.sh
          bash tools/deneb-printsvc-release-gate-selftest.sh
          bash tools/deneb-printsvc-release-evidence-selftest.sh
          bash tools/deneb-printsvc-native-audit-selftest.sh
          bash tools/deneb-printsvc-integration-audit-selftest.sh
          bash tools/deneb-web-ui-xss-selftest.sh
          sh tools/deneb-state-transitions-selftest.sh

      - name: Build and test native print service
        run: |
          cmake -S printsvc -B build/ci-printsvc -DBUILD_HOST_STUB=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-printsvc --parallel
          ctest --test-dir build/ci-printsvc --output-on-failure --no-tests=error \
            --parallel "$(nproc)" --schedule-random

      - name: Build host API and UI stubs
        run: |
          cmake -S web -B build/ci-web -DBUILD_HOST_STUB=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-web --parallel
          ctest --test-dir build/ci-web -N -R '^deneb-proxy-upload-tests$' | grep -F deneb-proxy-upload-tests
          ctest --test-dir build/ci-web --output-on-failure
          cmake -S ui -B build/ci-ui -DBACKEND_COMM_STUB=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-ui --parallel
          ctest --test-dir build/ci-ui --output-on-failure

      - name: Build native Digital Factory service
        run: |
          cmake -S dfsvc -B build/ci-dfsvc -DCMAKE_BUILD_TYPE=Debug -DMBEDTLS_ROOT="$PWD/build/ci-mbedtls"
          cmake --build build/ci-dfsvc --parallel
          ctest --test-dir build/ci-dfsvc --output-on-failure
