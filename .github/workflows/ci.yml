name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # PR validation only needs the synthetic merge and its two parents.
          # Push/manual runs retain full history for reliable range selection.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          submodules: false

      - name: Select validation lanes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' .github/workflows/ci.yml > "$RUNNER_TEMP/changed-files"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
          elif [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          else
            # If a push's base is unavailable, fail safe by running every lane.
            printf '%s\n' .github/workflows/ci.yml > "$RUNNER_TEMP/changed-files"
          fi

          native=false
          shell=false
          while IFS= read -r path; do
            case "$path" in
              *.sh) shell=true ;;
            esac
            case "$path" in
              .github/workflows/ci.yml|.gitmodules|common/*|dfsvc/*|printsvc/*|ui/*|web/*|tools/*|UM2C_MODDING_CHECKLIST.md|docs/PRINTSVC_EVIDENCE_LEDGER.md|docs/PRINTSVC_INTEGRATION_AUDIT.md)
                native=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          printf 'native=%s\n' "$native" >> "$GITHUB_OUTPUT"
          printf 'shell=%s\n' "$shell" >> "$GITHUB_OUTPUT"
          printf '%s\n' '### Validation selection' >> "$GITHUB_STEP_SUMMARY"
          printf '* Native lane: `%s`\n* Shell lane: `%s`\n* Changed files:\n' "$native" "$shell" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/  * `/' "$RUNNER_TEMP/changed-files" | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

      - name: Check out native submodules
        if: steps.changes.outputs.native == 'true'
        run: git submodule update --init --recursive

      - name: Install native host dependencies
        if: steps.changes.outputs.native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends build-essential cmake file libmbedtls-dev libzmq3-dev shellcheck

      - name: Check shell syntax and style
        if: steps.changes.outputs.shell == 'true'
        run: |
          find . -path ./.git -prune -o -path './ui/lib/lvgl' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r sh -n
          shellcheck tools/setup-linux-build.sh tools/setup-wsl-build.sh tools/build-update-release.sh

      - name: Run repository fixture and audit self-tests
        if: steps.changes.outputs.native == 'true'
        timeout-minutes: 10
        run: |
          bash tools/deneb-compile-all-selftest.sh
          bash tools/deneb-stock-menu-prune-selftest.sh
          bash tools/deneb-printsvc-smoke-selftest.sh
          bash tools/deneb-printsvc-stability.sh --selftest
          bash tools/deneb-printsvc-init-selftest.sh
          bash tools/deneb-printsvc-release-gate-selftest.sh
          bash tools/deneb-printsvc-native-audit-selftest.sh
          bash tools/deneb-printsvc-integration-audit-selftest.sh
      - name: Build and test native print service
        if: steps.changes.outputs.native == 'true'
        run: |
          cmake -S printsvc -B build/ci-printsvc -DBUILD_HOST_STUB=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-printsvc --parallel
          ctest --test-dir build/ci-printsvc --output-on-failure

      - name: Build host API and UI stubs
        if: steps.changes.outputs.native == 'true'
        run: |
          cmake -S web -B build/ci-web -DBUILD_HOST_STUB=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-web --parallel
          cmake -S ui -B build/ci-ui -DBACKEND_COMM_STUB=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-ui --parallel

      - name: Build native Digital Factory service
        if: steps.changes.outputs.native == 'true'
        run: |
          cmake -S dfsvc -B build/ci-dfsvc -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-dfsvc --parallel

      - name: Check documentation and publication boundary
        shell: pwsh
        run: tools/check-publication-boundary.ps1

      - name: Check license declarations
        run: pipx run --spec reuse==6.2.0 reuse lint

      - name: Scan changed Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar xzf "$archive" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] &&
               [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            log_opts="${BEFORE_SHA}..HEAD"
          else
            log_opts="--all"
          fi
          ./gitleaks git --redact --no-banner --verbose --log-opts="$log_opts" .
