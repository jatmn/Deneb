# SPDX-License-Identifier: MPL-2.0
name: Cura plugin package

# Publishes DenebUM2CNetworkPrinting.curapackage only. Do not attach this
# package to the get-started image releases, and do not publish .deneb
# packages from this workflow. The release is not marked Latest.

on:
  push:
    branches: [main]
    paths:
      - cura/plugins/DenebUM2CNetworkPrinting/**
      - tools/build-cura-plugin.ps1
      - .github/workflows/cura-plugin.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - cura/plugins/DenebUM2CNetworkPrinting/**
      - tools/build-cura-plugin.ps1
      - tools/inspect-cura-plugin-package.sh
      - tools/inspect-cura-plugin-package-selftest.ps1
      - .github/workflows/cura-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cura-plugin-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          submodules: false

      - name: Confirm package tools
        run: |
          command -v pwsh
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends unzip
          fi

      - name: Build Cura plugin package
        shell: pwsh
        run: tools/build-cura-plugin.ps1

      - name: Inspect Cura plugin package
        run: |
          set -euo pipefail
          bash tools/inspect-cura-plugin-package.sh dist/DenebUM2CNetworkPrinting.curapackage
          hash=$(sha256sum dist/DenebUM2CNetworkPrinting.curapackage | awk '{print $1}')
          printf '%s  %s\n' "$hash" DenebUM2CNetworkPrinting.curapackage > dist/DenebUM2CNetworkPrinting.curapackage.sha256
          (cd dist && sha256sum --check DenebUM2CNetworkPrinting.curapackage.sha256)

      - name: Publish package to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*"package_version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' cura/plugins/DenebUM2CNetworkPrinting/package.json)
          [ -n "$version" ]
          tag=cura-plugin
          title='Cura plugin'
          notes_file=$RUNNER_TEMP/cura-plugin-release-notes.md
          {
            echo 'DenebUM2CNetworkPrinting.curapackage (Cura desktop plugin; not printer firmware).'
            echo
            echo "source_sha: $GITHUB_SHA"
            echo "package_version: $version"
          } > "$notes_file"
          extra=(--notes-file "$notes_file" --target "$GITHUB_SHA" --title "$title" --latest=false)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --latest=false \
              --notes 'DenebUM2CNetworkPrinting.curapackage (Cura desktop plugin; not printer firmware).'
          fi
          gh release upload "$tag" \
            dist/DenebUM2CNetworkPrinting.curapackage \
            dist/DenebUM2CNetworkPrinting.curapackage.sha256 \
            --clobber
          gh release edit "$tag" "${extra[@]}"
