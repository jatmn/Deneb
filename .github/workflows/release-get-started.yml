# SPDX-License-Identifier: MPL-2.0
name: Release get-started image

# Publishes Deneb_get_started.img to the rolling get-started GitHub Release.
# The image version token is a stock-updater compatibility number, not a
# Deneb semver; do not bump it on overlay changes. Skip when bootstrap
# sources did not change. Do not publish .deneb packages here.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if get-started sources did not change
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-get-started
  cancel-in-progress: false

jobs:
  decide:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: false

      - name: Skip when get-started sources are unchanged
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          version=$(awk -F= '/^version=/ {
            sub(/#.*/, "", $2)
            gsub(/[[:space:]]/, "", $2)
            print $2
            exit
          }' packages/ssh-bootstrap/manifest.txt)
          [ -n "$version" ]
          prev=
          if notes=$(gh release view get-started --json body --jq .body 2>/dev/null); then
            prev=$(printf '%s\n' "$notes" | awk '/^source_sha:/{print $2; exit}')
          fi
          build=true
          if [ "$FORCE" != true ] && [ -n "$prev" ] && git cat-file -e "${prev}^{commit}" 2>/dev/null; then
            changed=$(bash tools/get-started-source-changed.sh --since "$prev" | awk -F= '$1=="changed"{print $2; exit}')
            if [ "$changed" = false ]; then
              build=false
            fi
          fi
          {
            echo "build=$build"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Get-started release build=$build version=$version previous_source_sha=${prev:-none}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    uses: ./.github/workflows/publish-get-started-img.yml
    with:
      version: ${{ needs.decide.outputs.version }}
      release_tag: get-started
      prerelease: false
      latest: true
      replace_notes: true
      title: get-started
    secrets: inherit
