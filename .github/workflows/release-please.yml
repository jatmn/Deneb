# SPDX-License-Identifier: MPL-2.0
name: release-please

# Versions packages/ssh-bootstrap only. Tagged releases attach
# Deneb_get_started.img from the same workflow; GITHUB_TOKEN releases do not
# start a separate on: release job. Do not publish .deneb packages here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['packages/ssh-bootstrap--tag_name'] || steps.release.outputs.tag_name }}
    steps:
      - name: Cut get-started release PR or tag
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  require-tag:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a release tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || {
            echo "release-please created a release but tag_name was empty" >&2
            exit 1
          }

  publish-get-started:
    needs: [release-please, require-tag]
    if: needs.require-tag.result == 'success'
    uses: ./.github/workflows/publish-get-started-img.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      release_tag: ${{ needs.release-please.outputs.tag_name }}
      prerelease: false
      latest: true
      replace_notes: false
    secrets: inherit
