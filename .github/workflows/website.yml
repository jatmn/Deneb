# SPDX-License-Identifier: MPL-2.0
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/branding/**"
      - "docs/touchscreen-screens/**"
      - ".github/workflows/website.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "website/**"
      - "assets/branding/**"
      - "docs/touchscreen-screens/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.25.x"
          cache-dependency-path: website/go.sum

      - name: Install Hugo extended
        run: |
          HUGO_VERSION="$(tr -d '[:space:]' < website/vendor-pins/hugo.version)"
          expected="$(awk '{print $1}' website/vendor-pins/hugo_extended_linux-amd64.tar.gz.sha256)"
          curl -fsSL -o /tmp/hugo.tgz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          actual="$(sha256sum /tmp/hugo.tgz | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Hugo tarball checksum mismatch: got ${actual}, expected ${expected}" >&2
            exit 1
          fi
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        run: |
          bash -n website/scripts/prepare-assets.sh
          bash -n website/scripts/build.sh
          bash website/scripts/build.sh

      - name: Upload pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deneb3d-site
          path: website/public
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deneb3d-site
          path: public

      - name: Upload to Bunny Storage and purge
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${BUNNY_STORAGE_ZONE:-}" || -z "${BUNNY_STORAGE_PASSWORD:-}" ||
                -z "${BUNNY_STORAGE_ENDPOINT:-}" || -z "${BUNNY_API_KEY:-}" ||
                -z "${BUNNY_PULL_ZONE_ID:-}" ]]; then
            echo "::warning::Bunny secrets are not configured; skipping deploy."
            exit 0
          fi
          cd public
          find . -type f | while IFS= read -r file; do
            filepath="${file#./}"
            case "${filepath##*.}" in
              html) ctype="text/html; charset=utf-8" ;;
              css) ctype="text/css; charset=utf-8" ;;
              js) ctype="text/javascript; charset=utf-8" ;;
              json) ctype="application/json; charset=utf-8" ;;
              xml) ctype="application/xml; charset=utf-8" ;;
              svg) ctype="image/svg+xml" ;;
              png) ctype="image/png" ;;
              jpg|jpeg) ctype="image/jpeg" ;;
              ico) ctype="image/x-icon" ;;
              txt) ctype="text/plain; charset=utf-8" ;;
              webmanifest) ctype="application/manifest+json" ;;
              *) ctype="application/octet-stream" ;;
            esac
            curl -fsS -X PUT \
              "${BUNNY_STORAGE_ENDPOINT%/}/${BUNNY_STORAGE_ZONE}/${filepath}" \
              -H "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
              -H "Content-Type: ${ctype}" \
              --upload-file "$filepath" >/dev/null
          done
          curl -fsS -X POST \
            "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" >/dev/null
          echo "Uploaded and purged Bunny Pull Zone ${BUNNY_PULL_ZONE_ID}"
